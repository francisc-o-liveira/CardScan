services:
  postgres:
    image: postgres:15-alpine
    container_name: cardscan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardscan
      POSTGRES_PASSWORD: cardscan
      POSTGRES_DB: cardscan
    ports:
      - "5432:5432"
    volumes:
      - cardscan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardscan -d cardscan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cardscan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cardscan_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cardscan_postgres_data:
  cardscan_redis_data:
